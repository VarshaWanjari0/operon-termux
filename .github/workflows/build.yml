name: Build Native Operon for Termux Bionic

on:
  workflow_dispatch:

jobs:
  build-android-bionic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install Ninja & Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake zip unzip pkg-config

      - name: Setup vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $HOME/vcpkg
          $HOME/vcpkg/bootstrap-vcpkg.sh

      - name: Clone Operon with Submodules
        run: |
          git clone --recursive https://github.com/heal-research/operon.git $HOME/operon

      - name: Install Dependencies via vcpkg Manifest
        run: |
          cd $HOME/operon
          # No package names needed! It automatically reads vcpkg.json!
          $HOME/vcpkg/vcpkg install \
            --triplet=arm64-android \
            --overlay-ports=./ports

      - name: Configure CMake for Android ARM64
        run: |
          cd $HOME/operon
          cmake -B build -S . -GNinja \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_OVERLAY_PORTS=./ports \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_CLI_PROGRAMS=ON \
            -DENABLE_TESTING=OFF

      - name: Compile Native Operon CLI
        run: |
          cd $HOME/operon
          ninja -C build operon_cli

      - name: Upload Finished Android Binary
        uses: actions/upload-artifact@v4
        with:
          name: operon_cli-termux-arm64
          path: $HOME/operon/build/cli/operon_cli          # Install dependencies for arm64-android using Operon's local ports
          $HOME/vcpkg/vcpkg install \
            --triplet=arm64-android \
            --overlay-ports=./ports \
            --x-install-root=$HOME/vcpkg_installed \
            cpp-sort eve fast_float fluky pratt-parser taskflow ariacsvparser eigen3 fmt

      - name: Configure CMake for Android ARM64
        run: |
          cd $HOME/operon
          cmake -B build -S . -GNinja \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_OVERLAY_PORTS=./ports \
            -DCMAKE_PREFIX_PATH=$HOME/vcpkg_installed/arm64-android \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_CLI_PROGRAMS=ON \
            -DENABLE_TESTING=OFF

      - name: Compile Native Operon CLI
        run: |
          cd $HOME/operon
          ninja -C build operon_cli

      - name: Upload Finished Android Binary
        uses: actions/upload-artifact@v4
        with:
          name: operon_cli-termux-arm64
          path: $HOME/operon/build/cli/operon_cli
